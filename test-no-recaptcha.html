<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sin reCAPTCHA</title>
</head>
<body>
    <h1>Test de Formulario Sin reCAPTCHA</h1>
    <form id="test-form" method="POST" action="includes/enviar-mensaje.php">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="mensaje" placeholder="Mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
    
    <script>
        // Verificar si hay scripts de reCAPTCHA cargados
        console.log('Scripts cargados:');
        const scripts = document.querySelectorAll('script[src]');
        scripts.forEach(script => {
            console.log(script.src);
            if (script.src.includes('recaptcha')) {
                console.error('¡reCAPTCHA encontrado!', script.src);
            }
        });
        
        // Verificar si hay elementos de reCAPTCHA en el DOM
        const recaptchaElements = document.querySelectorAll('[class*="recaptcha"], [id*="recaptcha"], [data-sitekey]');
        if (recaptchaElements.length > 0) {
            console.error('¡Elementos de reCAPTCHA encontrados!', recaptchaElements);
        } else {
            console.log('✅ No se encontraron elementos de reCAPTCHA');
        }
    </script>
</body>
</html>
